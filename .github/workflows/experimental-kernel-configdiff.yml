name: experimental kernel 7.3 config diff

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "kernel artifact id"
        default: "12504469235"
        type: string

jobs:
  diff:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - name: Fetch artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -o kern.zip \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ inputs.artifact_id }}/zip"
          mkdir kern && unzip -o kern.zip -d kern
          tar -xzf kern/boot-7.3-ophub.tar.gz -C . config-7.3-ophub
          curl -fsSL -o config-6.18 \
            https://raw.githubusercontent.com/ophub/kernel/main/kernel-config/release/stable/config-6.18
          ls -l config-6.18 config-7.3-ophub

      - name: Diff options relevant to early boot on S905D
        run: |
          set -eux
          norm() { grep -E '^CONFIG_[A-Z0-9_]+=' "$1" | sed 's/=.*//' | sort -u; }
          norm config-6.18 > a.txt
          norm config-7.3-ophub > b.txt
          echo "=== options present in 6.18 but gone in 7.3 (meson/boot related) ==="
          comm -23 a.txt b.txt | grep -Ei 'meson|mmc|usb|serial|phy|clk|pinctrl|regulator|scpi|sm_|arm64|psci|firmware|reset' || true
          echo
          echo "=== key options in 7.3 ==="
          grep -E '^CONFIG_(MESON|MMC_MESON|USB_DWC2|USB_DWC3|SERIAL_MESON|MESON_GXL_PHY|PINCTRL_MESON|CLK_MESON|ARM64_VA_BITS|ARM64_PAGE_SHIFT|ARM64_4K_PAGES|ARM64_16K_PAGES|PSCI|ARM_SCPI_PROTOCOL|MESON_SM|MESON_EFUSE|MESON_GX_SOCINFO|MESON_CANVAS|MESON_DRM|MESON_GXL_PHY|MESON8B_DWMAC|DWMAC_MESON|MESON_IRQ|BLK_DEV_SD|USB_STORAGE|BTRFS_FS)=' config-7.3-ophub || true
          echo
          echo "=== same options in 6.18 ==="
          grep -E '^CONFIG_(MESON|MMC_MESON|USB_DWC2|USB_DWC3|SERIAL_MESON|MESON_GXL_PHY|PINCTRL_MESON|CLK_MESON|ARM64_VA_BITS|ARM64_PAGE_SHIFT|ARM64_4K_PAGES|ARM64_16K_PAGES|PSCI|ARM_SCPI_PROTOCOL|MESON_SM|MESON_EFUSE|MESON_GX_SOCINFO|MESON_CANVAS|MESON_DRM|MESON_GXL_PHY|MESON8B_DWMAC|DWMAC_MESON|MESON_IRQ|BLK_DEV_SD|USB_STORAGE|BTRFS_FS)=' config-6.18 || true
