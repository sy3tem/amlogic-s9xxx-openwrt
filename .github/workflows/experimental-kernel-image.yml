name: experimental kernel 7.3 image

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "kernel artifact id from the 7.3 build"
        default: "12504469235"
        type: string
      kernel_ver:
        description: "version tag used inside the artifact"
        default: "7.3"
        type: string

jobs:
  image:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -eux
          for i in 1 2 3; do
            sudo timeout 300 apt-get update && break || sleep 15
          done
          sudo timeout 900 apt-get install -y --no-install-recommends \
            busybox-static u-boot-tools cpio gzip qemu-system-arm unzip curl

      - name: Download the existing kernel artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o kern.zip \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ inputs.artifact_id }}/zip"
          mkdir -p kern && unzip -o kern.zip -d kern
          ls -lh kern

      - name: Unpack kernel
        run: |
          set -eux
          mkdir -p k
          tar -C k -xzf "kern/boot-${{ inputs.kernel_ver }}-ophub.tar.gz"
          ls -lh k/boot/Image
          ls -lh k/boot/dtb/amlogic/meson-gxl-s905d-phicomm-n1.dtb

      - name: Sanity check the Image in QEMU
        run: |
          set -x
          timeout 40 qemu-system-aarch64 -M virt -cpu cortex-a53 -m 2048 -smp 2 \
            -kernel k/boot/Image -nographic \
            -append "console=ttyAMA0 earlycon panic=-1" 2>&1 | head -60 || true
          echo "=== qemu exit: $? ==="

      - name: Build a small initramfs
        run: |
          set -eux
          rm -rf irfs && mkdir -p irfs/{bin,dev,proc,sys,newroot}
          cp /bin/busybox irfs/bin/busybox
          chmod 755 irfs/bin/busybox
          for a in sh mount umount sleep findfs switch_root echo cat mkdir mdev; do
            ln -sf busybox "irfs/bin/$a"
          done
          cat > irfs/init <<'EOF'
          #!/bin/busybox sh
          /bin/busybox --install -s /bin
          mount -t devtmpfs devtmpfs /dev
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          /bin/mdev -s
          sleep 2
          ROOTARG=$(cat /proc/cmdline | tr ' ' '\n' | grep '^root=' | cut -d= -f2-)
          echo "initramfs: root=$ROOTARG"
          ROOTDEV=$(findfs "$ROOTARG")
          echo "initramfs: device=$ROOTDEV"
          [ -n "$ROOTDEV" ] || exec sh
          mount -t btrfs -o rw "$ROOTDEV" /newroot || exec sh
          mount --move /dev /newroot/dev
          mount --move /proc /newroot/proc
          mount --move /sys /newroot/sys
          exec switch_root /newroot /sbin/init
          EOF
          chmod 755 irfs/init
          ( cd irfs && find . | cpio -o -H newc --quiet | gzip -9 ) > initrd.img
          ls -lh initrd.img
          mkimage -A arm64 -O linux -T ramdisk -C gzip -n uInitrd -d initrd.img uInitrd-7.3 || \
            mkimage -A arm -O linux -T ramdisk -C gzip -n uInitrd -d initrd.img uInitrd-7.3
          ls -lh uInitrd-7.3
          hexdump -C uInitrd-7.3 | head -2

      - name: Download the working image
        run: |
          set -eux
          URL="https://github.com/sy3tem/amlogic-s9xxx-openwrt/releases/download"
          TAG="OpenWrt_imagebuilder_immortalwrt_25.12-SNAPSHOT_2026.10"
          FILE="openwrt_immortalwrt_amlogic_s905d_k6.18.58_2026.10.23.img.gz"
          curl -fL --retry 5 -o base.img.gz "${URL}/${TAG}/${FILE}"
          gzip -dk base.img.gz
          ls -lh base.img

      - name: Swap kernel, dtb and initramfs (boot.scr untouched)
        run: |
          set -eux
          LOOP=$(sudo losetup --find --show -P base.img)
          echo "loop=$LOOP"
          sudo mkdir -p /mnt/boot
          sudo mount "${LOOP}p1" /mnt/boot
          ls -l /mnt/boot/boot.scr
          sudo cp k/boot/Image /mnt/boot/zImage
          sudo cp k/boot/dtb/amlogic/meson-gxl-s905d-phicomm-n1.dtb \
                  /mnt/boot/dtb/amlogic/meson-gxl-s905d-phicomm-n1.dtb
          sudo cp uInitrd-7.3 /mnt/boot/uInitrd
          sudo sed -i 's|^INITRD=.*|INITRD=/uInitrd|' /mnt/boot/uEnv.txt
          grep -E 'LINUX|INITRD|FDT' /mnt/boot/uEnv.txt
          sync
          sudo umount /mnt/boot
          sudo losetup -d "$LOOP"

      - name: Repack and hash
        run: |
          set -eux
          NAME="openwrt_immortalwrt_amlogic_s905d_k${{ inputs.kernel_ver }}_test.img"
          mv base.img "$NAME"
          gzip -1 "$NAME"
          ls -lh "$NAME.gz"
          sha256sum "$NAME.gz" | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: test-image-k${{ inputs.kernel_ver }}
          path: |
            *.img.gz
            sha256.txt
